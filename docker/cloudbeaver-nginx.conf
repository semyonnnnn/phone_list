server {
    listen 80;

    # allow-list: your PC only, everyone else gets 403
    allow 10.166.25.182;
    deny all;

    location / {
        proxy_pass http://cloudbeaver:8978;
        proxy_set_header Host $host;
        # CloudBeaver may use websockets, so keep the upgrade headers
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}