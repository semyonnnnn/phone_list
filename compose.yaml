services:
    laravel.test:
        build:
            context: './docker/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
                MYSQL_CLIENT: mariadb-client
        image: 'sail-8.5/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT}:80'
            # - '${LAN_BIND}:${VITE_PORT}:5173'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - mariadb
            - python
        restart: unless-stopped

    mariadb:
        image: 'mariadb:11'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
        volumes:
            - 'sail-mariadb:/var/lib/mysql'
            - './docker/mariadb/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        networks:
            sail:
            db-admin-net:
                aliases:
                    - '${DB_ADMIN_ALIAS:-mariadb-phones-dev}'
        restart: unless-stopped

    python:
        build:
            context: '.'
            dockerfile: python.Dockerfile
        volumes:
            - ./app/Python:/app
        working_dir: /app
        networks:
            - sail
        restart: unless-stopped
        command: uvicorn server:app --host 0.0.0.0 --port 5000 --reload

networks:
    sail:
        driver: bridge
    db-admin-net:
        external: true

volumes:
    sail-mariadb:
        driver: local
