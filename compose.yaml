services:
    laravel.test:
        build:
            context: './docker/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
                MYSQL_CLIENT: mariadb-client
        image: 'sail-8.5/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT}:80'
            - '${LAN_BIND}:${VITE_PORT}:5173'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - mariadb
            - python

    mariadb:
        image: 'mariadb:11'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
        volumes:
            - 'sail-mariadb:/var/lib/mysql'
            - './docker/mariadb/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        networks:
            - sail
        healthcheck:
            test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
            retries: 3
            timeout: 5s

    mariadb-gate:
        image: nginx:alpine
        ports:
            - '${LAN_BIND}:${FORWARD_DB_PORT}:3306'
        volumes:
            - './docker/${NGINX_DIR:-nginx_dev}/mariadb-nginx.conf:/etc/nginx/nginx.conf:ro'
        depends_on:
            - mariadb
        networks:
            - sail

    cloudbeaver:
        image: dbeaver/cloudbeaver:latest
        volumes:
            - 'cloudbeaver-data:/opt/cloudbeaver/workspace'
        depends_on:
            - mariadb
        networks:
            - sail

    cloudbeaver-gate:
        image: nginx:alpine
        ports:
            # this is the only published CloudBeaver port; the allow-list
            # inside the nginx config decides who gets through
            - '${LAN_BIND:-127.0.0.1}:${CLOUDBEAVER_PORT}:80'
        volumes:
            - './docker/${NGINX_DIR:-nginx_dev}/cloudbeaver-nginx.conf:/etc/nginx/conf.d/default.conf:ro'
        depends_on:
            - cloudbeaver
        networks:
            - sail

    python:
        build:
            context: '.'
            dockerfile: python.Dockerfile
        volumes:
            - ./app/Python:/app
        working_dir: /app
        ports:
            # Laravel doesn't use this mapping, it calls http://python:8000 inside the network
            - '${LOCAL_BIND:-127.0.0.1}:${PYTHON_PORT:-5000}:5000'
        networks:
            - sail
        restart: unless-stopped
        command: uvicorn server:app --host 0.0.0.0 --port 5000 --reload

networks:
    sail:
        driver: bridge

volumes:
    sail-mariadb:
        driver: local
    cloudbeaver-data:
        driver: local
